<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SE24 Field Cards</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SE24 Field Cards</p>
          <h1>Nearby</h1>
        </div>
        <button id="headingButton" class="ghost-button" type="button">Compass</button>
      </header>

      <section class="stats" aria-label="Collection progress">
        <div>
          <strong id="targetCount">0</strong>
          <span>nearby</span>
        </div>
        <div>
          <strong id="collectedCount">0</strong>
          <span>found</span>
        </div>
        <div>
          <strong id="collectionValue">0</strong>
          <span>value</span>
        </div>
      </section>

      <section id="nearbyView" class="view active" aria-label="Nearby compass">
        <div class="compass-panel">
          <div class="compass-status">
            <span id="locationStatus">Finding GPS</span>
            <span id="headingStatus">North-up</span>
          </div>
          <div id="compass" class="compass" aria-label="Directions to nearby objects">
            <div class="ring outer"></div>
            <div class="ring inner"></div>
            <div class="ring horizon"></div>
            <div class="north">N</div>
            <div class="you"></div>
            <div id="targetLayer"></div>
          </div>
          <div class="signal-control">
            <label for="signalRange">
              <span>Signal</span>
              <strong id="signalMode">Everyday</strong>
            </label>
            <input id="signalRange" type="range" min="0" max="3" step="1" value="0">
          </div>
          <div id="signalList" class="signal-list" aria-label="Visible signals"></div>
        </div>

        <section id="focusCard" class="focus-card" aria-live="polite"></section>
      </section>

      <section id="collectedView" class="view" aria-label="Collected cards">
        <header class="section-head">
          <h2>Collected</h2>
          <p id="collectedSummary">Nothing collected yet.</p>
        </header>
        <div id="collectedList" class="list"></div>
      </section>

      <section id="setsView" class="view" aria-label="Card sets">
        <header class="section-head">
          <h2>Sets</h2>
          <p>Groups you are building as you walk.</p>
        </header>
        <div id="setsList" class="list"></div>
      </section>

      <nav class="tabbar" aria-label="Views">
        <button class="tab active" data-view="nearby" type="button">Nearby</button>
        <button class="tab" data-view="collected" type="button">Collected</button>
        <button class="tab" data-view="sets" type="button">Sets</button>
      </nav>
    </main>

    <template id="targetTemplate">
      <button class="field-object" type="button">
        <span class="field-symbol"></span>
        <span class="field-value"></span>
      </button>
    </template>

    <script src="app.js"></script>
  </body>
</html>
